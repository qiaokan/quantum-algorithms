name: Validate textbook

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-examples.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install numerical-example dependencies
        run: python -m pip install -r requirements-examples.txt
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Audit content and build
        run: npm run build
      - name: Audit built links and fragments
        run: npm run audit:links
      - name: Numerical example checks
        run: |
          python public/examples/search-fourier-checks.py
          python public/examples/matrix-checks.py
          python public/examples/nand-checks.py
          python public/examples/hallgren-checks.py
          python public/examples/applications.py
      - name: Desktop and mobile browser checks
        run: npm run test:browser
